<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>UPICON Mitra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&family=Noto+Sans+Devanagari:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- Floating launcher -->
<button id="launcher" aria-label="Open UPICON Mitra">
  <video class="launcher-icon" src="assets/launcher-icon.mp4" autoplay loop muted playsinline aria-hidden="true"></video>
  <span class="launcher-dot" id="launcherDot" hidden></span>
</button>

<!-- Chat panel -->
<section id="panel" class="hidden" role="dialog" aria-label="UPICON Mitra chat">

  <header class="panel-header">
    <div class="header-id">
      <div class="header-avatar">U</div>
      <div>
        <p class="header-title" id="headerTitle">UPICON Mitra</p>
        <p class="header-sub" id="headerSub">Online</p>
      </div>
    </div>

    <div class="header-actions">
      <div class="lang-toggle" id="langToggle" data-active="en" role="group" aria-label="Choose language">
        <span class="lang-pill"></span>
        <button type="button" class="lang-btn active" data-lang="en">EN</button>
        <button type="button" class="lang-btn" data-lang="hi">हि</button>
      </div>
      <button id="closeBtn" aria-label="Close chat">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M6 6l12 12M18 6L6 18"/>
        </svg>
      </button>
    </div>
  </header>

  <div class="saffron-rule"></div>

  <main id="messages" class="messages" aria-live="polite">
    <!-- messages injected here -->
  </main>

  <div id="suggestions" class="suggestions">
    <button class="chip" data-chip="initiatives" data-q-en="What initiatives does UPICON run?" data-q-hi="UPICON की मुख्य पहलें कौन सी हैं?">Initiatives</button>
    <button class="chip" data-chip="careers" data-q-en="Are there any job openings right now?" data-q-hi="क्या अभी कोई नौकरी के अवसर उपलब्ध हैं?">Careers</button>
    <button class="chip" data-chip="schemes" data-q-en="Tell me about current schemes" data-q-hi="वर्तमान योजनाओं के बारे में बताएं">Schemes</button>
    <button class="chip" data-chip="news" data-q-en="Latest news updates" data-q-hi="नवीनतम समाचार अपडेट बताएं">News</button>
  </div>

  <form id="composer" class="composer">
    <button type="button" id="micBtn" class="icon-btn" aria-label="Speak your question">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Z"/>
        <path d="M19 11a7 7 0 0 1-14 0M12 18v3"/>
      </svg>
      <span class="mic-ring" id="micRing"></span>
    </button>

    <input
      id="textInput"
      type="text"
      autocomplete="off"
      placeholder="Type your question…"
      aria-label="Message"
    />

    <button type="button" id="speakerBtn" class="icon-btn" aria-label="Read reply aloud" data-state="idle">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M4 9v6h4l5 4V5L8 9H4Z"/>
        <path id="speakerWaves" d="M16 9a4 4 0 0 1 0 6" opacity="0.35"/>
        <path id="speakerCross" d="M3 3L21 21" stroke-linecap="round" style="display:none;"/>
      </svg>
    </button>

    <button type="submit" id="sendBtn" class="send-btn" aria-label="Send">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M4 12h15M13 6l6 6-6 6"/>
      </svg>
    </button>
  </form>
</section>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
<script src="script.js"></script>
</body>
</html>
